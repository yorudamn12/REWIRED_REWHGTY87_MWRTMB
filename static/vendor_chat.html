<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2c34">
  <title>ListLens · Store alerts</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="chat">
<div class="phone">
  <!-- Pop-down banner, like a phone notification, when a new alert arrives -->
  <div id="toast" class="toast hidden">
    <div class="toast-app">🔍 ListLens · now</div>
    <div class="toast-text" id="toastText"></div>
  </div>

  <!-- Top bar -->
  <div class="chat-header">
    <button class="icon-btn" title="Back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <div class="avatar">LL</div>
    <div class="header-text">
      <div class="title">ListLens</div>
      <div class="sub">Order alerts · Sharma General Store<span id="mockBadge" class="mock-badge hidden">MOCK MODE</span></div>
    </div>
    <button class="icon-btn" title="Menu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </div>

  <!-- Alerts -->
  <div id="messages" class="messages">
    <div class="chip">Today</div>
    <div class="chip info">🔔 ListLens messages you here when a new order arrives, when a customer replies, and when stock runs low.</div>
  </div>

  <!-- Read-only footer: alerts only, actions happen on the dashboard -->
  <div class="readonly-bar">
    Only ListLens sends messages here ·
    <a href="/vendor" target="_blank">Open dashboard ↗</a>
  </div>
</div>

<script>
const ICON_OPEN = '<svg viewBox="0 0 24 24"><path d="M14 3v2h3.6l-9.8 9.8 1.4 1.4L19 6.4V10h2V3zM19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2z"/></svg>';

let lastId = 0;
let firstLoad = true;    // don't pop banners for old alerts when the page opens
let unread = 0;
const messagesEl = document.getElementById("messages");

fetch("/api/config").then(r => r.json()).then(cfg => {
  if (cfg.mode === "mock") document.getElementById("mockBadge").classList.remove("hidden");
});

// Poll the store's alert chat every 2 seconds
async function poll() {
  const msgs = await (await fetch(`/api/messages?buyer=__store__&after=${lastId}`)).json();
  for (const m of msgs) {
    if (m.id <= lastId) continue;
    renderAlert(m);
    lastId = m.id;
    if (!firstLoad) showToast(m.payload.text);
  }
  if (msgs.length) messagesEl.scrollTop = messagesEl.scrollHeight;
  firstLoad = false;
}

function renderAlert(m) {
  const row = document.createElement("div");
  row.className = "row bot first";
  const bubble = document.createElement("div");
  bubble.className = "bubble bot choice-bubble";
  bubble.appendChild(document.createTextNode(m.payload.text));

  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = m.created_at.slice(11, 16);
  bubble.appendChild(meta);

  // Button that opens this order on the dashboard (new tab)
  if (m.payload.order_id) {
    const box = document.createElement("div");
    box.className = "choice-buttons";
    const a = document.createElement("a");
    a.className = "link-btn";
    a.href = `/vendor?order=${m.payload.order_id}`;
    a.target = "_blank";
    a.innerHTML = ICON_OPEN;
    a.appendChild(document.createTextNode(`Open order #${m.payload.order_id}`));
    box.appendChild(a);
    bubble.appendChild(box);
  }
  row.appendChild(bubble);
  messagesEl.appendChild(row);
}

// Phone-style banner + short beep + unread count in the tab title
function showToast(text) {
  document.getElementById("toastText").textContent = text.split("\n").slice(0, 2).join(" · ");
  const toast = document.getElementById("toast");
  toast.classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.add("hidden"), 4000);
  if (document.hidden) document.title = `(${++unread}) ListLens · Store alerts`;
  beep();
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { unread = 0; document.title = "ListLens · Store alerts"; }
});

function beep() {
  try {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch (e) { /* sound is optional */ }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
