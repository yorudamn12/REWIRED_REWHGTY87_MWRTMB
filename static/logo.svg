<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- ListLens logo: magnifying glass (dark navy) over a green checklist -->
  <rect width="100" height="100" fill="#ffffff"/>
  <!-- handle -->
  <line x1="62" y1="62" x2="82" y2="82" stroke="#111c2e" stroke-width="10" stroke-linecap="round"/>
  <!-- lens ring -->
  <circle cx="44" cy="44" r="27" fill="#ffffff" stroke="#111c2e" stroke-width="8"/>
  <!-- checklist: dots + bars -->
  <g fill="#1f9d55">
    <circle cx="33" cy="33" r="3.6"/>
    <rect x="40" y="29.4" width="20" height="7.2" rx="3.6"/>
    <circle cx="33" cy="45" r="3.6"/>
    <rect x="40" y="41.4" width="15" height="7.2" rx="3.6"/>
    <rect x="29.4" y="53.4" width="14" height="7.2" rx="3.6"/>
  </g>
  <!-- tick -->
  <path d="M46 56 l5 5 l10 -11" fill="none" stroke="#1f9d55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
